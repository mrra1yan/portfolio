# Override the old Node 22.11 package used by the deployment server.
# This is the Node 24 nixpkgs revision used by the Nixpacks Node provider.
[phases.setup]
nixpkgsArchive = "23f9169c4ccce521379e602cc82ed873a1f1b52b"
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["node --version", "npm ci --include=dev --include=optional"]

# Keep Nixpacks' detected Caddy SPA server and its default start command.
[phases.build]
cmds = ["npm run build"]
